<div class="row justify-content-md-center">
<div class="col-12" [class.col-md-6]="!fullWidth">
  <h2 class="text-center mb-3">
    Evaluacion de Jugadores
</h2>
<form [formGroup]="evaluationForm" (ngSubmit)="onSubmit()" class="fcol modern-evaluation-form">
        <input name="scout" type="text" formControlName="scoutId" value="{{scout_id}}" hidden readonly required>
        <input name="scout" type="text" formControlName="scoutname" value="{{scout_name}}" hidden readonly required>

    <div class="accordion accordion-flush modern-accordion" id="accordionFlushExample">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseOne" aria-expanded="false" aria-controls="flush-collapseOne">
                Informacion del Jugador
            </button>
          </h2>
          <div id="flush-collapseOne" class="accordion-collapse collapse show" >
              <div class="accordion-body">
                <div class="row g-3 align-items-stretch">
                  <div class="col col-12 col-lg-5">
                    <div class="evaluation-photo-card">
                      <img id="image" class="evaluation-photo-card__image" [src]="imageUrl">
                      <label *ngIf="this.selectedPlayer.id" class="evaluation-photo-card__upload" for="photoFile"><i class="fa fa-camera"></i></label>
                      <input *ngIf="this.selectedPlayer.id" class="evaluation-photo-card__input" id="photoFile" type="file" (change)="onFileSelected($event)" accept="image/*" maxFileSize="10000000">
                    </div>
                  </div>
                <div class="col col-12 col-lg-7">
                  <label class="frow" for="filtroJugador">Jugador:&nbsp;</label>
                  <div class="frow" style="position: relative;">
                      <input id="filtroJugador" type="text" class="form-control" autocomplete="off" [value]="playerFilter"
                             (input)="onPlayerFilterChange($any($event.target).value)"
                             (focus)="showPlayerList = true"
                             (blur)="hidePlayerList()"
                             placeholder="Filtrar por nombre o número">
                      <ul *ngIf="showPlayerList && filteredPlayers.length > 0"
                          class="list-group"
                          style="position: absolute; top: 100%; left: 0; z-index: 10; width: 100%; max-height: 220px; overflow-y: auto;">
                        <li *ngFor="let player of filteredPlayers"
                            class="list-group-item list-group-item-action"
                            style="cursor: pointer;"
                            (click)="selectPlayer(player)">
                          {{player.number ? player.number + ' - ' : ''}}{{player.name}}
                        </li>
                      </ul>
                  </div>
                  <input type="hidden" formControlName="playerId">
                  <label class="frow" for="edad">Posicion Registrada:&nbsp;</label>
                  <input class="frow" disabled id="position" type="text" value="{{selectedPlayer.position}}">
                  <label class="frow" for="numero">Número:&nbsp;</label>
                  <div class="frow" style="display: flex; gap: 0.5rem; align-items: center;">
                    <input #numeroInput id="numero" type="number" [value]="selectedPlayer.number" [disabled]="!selectedPlayer.id">
                    <button type="button" class="btn btn-sm btn-warning" [disabled]="!selectedPlayer.id" (click)="savePlayerNumber(numeroInput.value)" title="Guardar número">
                      <i class="fas fa-floppy-disk"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseTwo" aria-expanded="false" aria-controls="flush-collapseTwo">
                Posicion(es)
            </button>
          </h2>
          <div id="flush-collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
            <div class="accordion-body">
                <div class="frow" *ngFor="let pos of positions">
                    <input type="checkbox" id="{{pos.report}}" name="posicion-{{pos}}" value="{{pos.report}}" formControlName="posicion-{{pos.report}}">
                    <label class="checkbox-label" for="p{{pos}}">&nbsp;{{pos.localized}}&nbsp;</label>
                </div>
            </div>
          </div>
        </div>
        <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseThree" aria-expanded="false" aria-controls="flush-collapseThree">
                  Tiro
              </button>
            </h2>
            <div id="flush-collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
              <div class="accordion-body">
                <div class="frow" *ngFor="let tiro of tiros">
                    <label class="frow">{{tiro.localized}}:&nbsp;</label>
                    <div *ngFor="let idx of [1,2,3,4,5]">
                      <input type="radio" id="{{tiro.report}}{{idx}}" name="tiro-{{tiro.report}}" value="{{idx}}" formControlName="tiro-{{tiro.report}}">
                      <label class="radio-label" for="{{tiro.report}}{{idx}}">&nbsp;{{idx}}&nbsp;</label>
                    </div>
                    &nbsp;|&nbsp;
                    <button type="button" class="radio-label reset-button" (click)="clearControl('tiro-' + tiro.report)" title="Limpiar">
                      <i class="fas fa-rotate-left"></i>
                    </button>
                </div>
              </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseFour" aria-expanded="false" aria-controls="flush-collapseFour">
                  Pase
              </button>
            </h2>
            <div id="flush-collapseFour" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
              <div class="accordion-body">
                <div class="frow" *ngFor="let ps of pases">
                    <label class="frow">{{ps.localized}}:&nbsp;</label>
                    <div *ngFor="let idx of [1,2,3,4,5]">
                        <input type="radio" id="{{ps.report}}{{idx}}" name="pase-{{ps.report}}" value="{{idx}}" formControlName="pase-{{ps.report}}">
                        <label class="radio-label" for="{{ps.report}}{{idx}}">&nbsp;{{idx}}&nbsp;</label>
                    </div>
                    &nbsp;|&nbsp;
                    <button type="button" class="radio-label reset-button" (click)="clearControl('pase-' + ps.report)" title="Limpiar">
                      <i class="fas fa-rotate-left"></i>
                    </button>
                </div>
              </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseFive" aria-expanded="false" aria-controls="flush-collapseFive">
                  Defensa
              </button>
            </h2>
            <div id="flush-collapseFive" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
              <div class="accordion-body">
                <div class="frow" *ngFor="let df of defensas">
                    <label class="frow">{{df.localized}}:&nbsp;</label>
                    <div *ngFor="let idx of [1,2,3,4,5]">
                        <input type="radio" id="{{df.report}}{{idx}}" name="defensa-{{df.report}}" value="{{idx}}" formControlName="defensa-{{df.report}}">
                        <label class="radio-label" for="{{df.report}}{{idx}}">&nbsp;{{idx}}&nbsp;</label>
                    </div>
                    &nbsp;|&nbsp;
                    <button type="button" class="radio-label reset-button" (click)="clearControl('defensa-' + df.report)" title="Limpiar">
                      <i class="fas fa-rotate-left"></i>
                    </button>
                </div>
              </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseSix" aria-expanded="false" aria-controls="flush-collapseSix">
                  Bote
              </button>
            </h2>
            <div id="flush-collapseSix" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
              <div class="accordion-body">
                <div class="frow" *ngFor="let bt of botes">
                    <label class="frow">{{bt.localized}}:&nbsp;</label>
                    <div *ngFor="let idx of [1,2,3,4,5]">
                        <input type="radio" id="{{bt.report}}{{idx}}" name="bote-{{bt.report}}" value="{{idx}}" formControlName="bote-{{bt.report}}">
                        <label class="radio-label" for="{{bt.report}}{{idx}}">&nbsp;{{idx}}&nbsp;</label>
                    </div>
                    &nbsp;|&nbsp;
                    <button type="button" class="radio-label reset-button" (click)="clearControl('bote-' + bt.report)" title="Limpiar">
                      <i class="fas fa-rotate-left"></i>
                    </button>
                </div>
              </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseSeven" aria-expanded="false" aria-controls="flush-collapseSeven">
                  Jugador
              </button>
            </h2>
            <div id="flush-collapseSeven" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
              <div class="accordion-body">
                <div class="frow" *ngFor="let jg of jugadores">
                    <label class="frow">{{jg.localized}}:&nbsp;</label>
                    <div *ngFor="let idx of [1,2,3,4,5]">
                        <input type="radio" id="{{jg.report}}{{idx}}" name="jugador-{{jg.report}}" value="{{idx}}" formControlName="jugador-{{jg.report}}">
                        <label class="radio-label" for="{{jg.report}}{{idx}}">&nbsp;{{idx}}&nbsp;</label>
                    </div>
                    &nbsp;|&nbsp;
                    <button type="button" class="radio-label reset-button" (click)="clearControl('jugador-' + jg.report)" title="Limpiar">
                      <i class="fas fa-rotate-left"></i>
                    </button>
                </div>
              </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseEight" aria-expanded="false" aria-controls="flush-collapseEight">
                Estilo de Juego  
              </button>
            </h2>
            <div id="flush-collapseEight" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
              <div class="accordion-body">
                <div class="frow" *ngFor="let est of estilos">
                    <input type="checkbox"  id="{{est.report}}" name="estilo-{{est.report}}" value="{{est}}" formControlName="estilo-{{est.report}}">
                    <label class="checkbox-label" for="{{est.report}}">&nbsp;{{est.localized}}&nbsp;</label>
                </div>
              </div>
            </div>
        </div>

        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseNine" aria-expanded="false" aria-controls="flush-collapseNine">
                Evaluation General
            </button>
          </h2>
          <div id="flush-collapseNine" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
            <div class="accordion-body">
                <div class="frow" *ngFor="let ev of evalGens">
                    <input type="radio" alt="{{ev.value}}{{ev.report}}" id="{{ev.value}}{{ev.report}}" name="general-{{ev.report}}" value="{{ev.value}}" formControlName="general-{{ev.report}}">
                    <label class="radio-label" for="{{ev.value}}{{ev.report}}">&nbsp;{{ev.value}} - {{ev.localized}}&nbsp;</label>
                </div>
                <div class="frow">
                  <button type="button" class="radio-label reset-button" (click)="clearControl('general-general')" title="Limpiar">
                    <i class="fas fa-rotate-left"></i>
                  </button>
                </div>
            </div>
          </div>
        </div>

        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseTen" aria-expanded="false" aria-controls="flush-collapseTen">
              Nominacion a Premios
            </button>
          </h2>
          <div id="flush-collapseTen" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
            <div class="accordion-body">
              <div class="frow" *ngFor="let nom of nominaciones">
                  <input type="checkbox"  id="{{nom.report}}" name="nominacion-{{nom.report}}" value="{{nom}}" formControlName="nominacion-{{nom.report}}">
                  <label class="checkbox-label" for="{{nom.report}}">&nbsp;{{nom.localized}}&nbsp;</label>
              </div>
            </div>
          </div>
      </div>

    </div>
    <div class="frow">
        <button type="submit" class="btn btn-warning" [disabled]="!evaluationForm.valid">Guardar</button>
    </div>
</form>

<div class="modal"
  tabindex="-1"
  role="dialog"
  [ngStyle]="{'display':displayPhotoPopup}">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" role="document">
    <div class="modal-content modern-player-modal">
      <div class="modal-header dark-header">
        <h5 class="modal-title">Remplazar imagen</h5>
        <button type="button" class="btn-close" (click)="closePhotoPopup()" aria-label="Close">
        </button>
      </div>
      <div class="modal-body modern-player-modal__body">
        <p class="modern-player-modal__text">Estas seguro que quieres remplazar la imagen del jugador "{{selectedPlayer.name}}". Esta accion es irreversible.</p>
      </div>
      <div class="modal-footer modern-player-modal__footer">
        <button type="button" class="btn btn-outline-dark" 
                (click)="confirmReplacePhoto()">
          Sí
        </button>
        <button type="button" class="btn btn-outline-dark" 
                (click)="closePhotoPopup()">
          No
        </button>
      </div>
    </div>
  </div>
</div>

<div
  class="modal"
  tabindex="-1"
  role="dialog"
  [ngStyle]="{'display':displayStyle}">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content modern-player-modal">
      <div class="modal-body modern-player-modal__body">
        <p class="modern-player-modal__text">{{submitReportMessage}}</p>
  
      </div>
      <div class="modal-footer modern-player-modal__footer">
        <button type="button" class="btn btn-outline-dark" 
                (click)="closePopup()">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</div>

</div>
</div>
