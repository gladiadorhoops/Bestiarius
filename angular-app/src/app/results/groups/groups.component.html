<div class="row justify-content-md-center">
    <div class="accordion accordion-flush modern-accordion" id="accordionFlushExample">
        <div class="accordion-item">
            <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseGps" aria-expanded="false" aria-controls="flush-collapseOne">
                Fase de Grupos
            </button>
            </h2>
            <div id="flush-collapseGps" class="accordion-collapse collapse show" >
            <div class="accordion-body">
                <div class="spinner-border text-light" role="status" *ngIf="loading">
                    <span class="sr-only">Loading...</span>
                </div>

                <!-- Reusable read-only match card, same format as scouting/standings. -->
                <ng-template #matchCard let-match>
                    <div class="match-card match-card--readonly mb-3">
                        <!-- Category tag pinned top-left. -->
                        <span class="match-badge">{{match.category}}</span>
                        <!-- Gym's live transmission pinned top-right, only when one is registered. -->
                        <a class="match-live-feed" *ngIf="match.location.live_feed"
                           [href]="match.location.live_feed" target="_blank" rel="noopener"
                           title="Transmisión en Vivo" aria-label="Transmisión en Vivo">
                            <i class="fas fa-video"></i>
                        </a>

                        <div class="match-card__meta">
                            <!-- Primary line: which group + when. -->
                            <div class="match-card__title">
                                <span class="match-time"><i class="fas fa-clock"></i>&nbsp;{{match.time}}</span>
                            </div>
                            <!-- Secondary line: where (gym) — clickable. -->
                            <a class="match-location" target="_blank" rel="noopener"
                               href="https://www.google.com/maps/search/?api=1&query_place_id={{match.location.place_id}}&query={{match.location.address}}">
                                <i class="fas fa-location-dot"></i>&nbsp;{{match.location.name}}
                            </a>
                        </div>

                        <div class="match-card__scoreboard">
                            <div class="match-team">
                                <img class="tournament-match__logo" [src]="teamLogoUrl(match.homeTeam)" (error)="onLogoError($event)" alt="" />
                                <div class="match-team__name">{{match.homeTeam.name}}</div>
                                <div class="match-score match-score--static">{{match.homePoints}}</div>
                            </div>
                            <span class="match-vs">×</span>
                            <div class="match-team">
                                <img class="tournament-match__logo" [src]="teamLogoUrl(match.visitorTeam)" (error)="onLogoError($event)" alt="" />
                                <div class="match-team__name">{{match.visitorTeam.name}}</div>
                                <div class="match-score match-score--static">{{match.visitorPoints}}</div>
                            </div>
                        </div>
                    </div>
                </ng-template>

                <div class="row" *ngIf="!loading">
                    <!-- One column per group that still has matches after the
                         page's filters; both categories share this list. -->
                    <div class="col col-12">
                        <div class="row">
                            <div class="col col-12 col-md-6" *ngFor="let entry of visibleGroups">
                                <h3 class="text-center">{{entry.group}}</h3>
                                <ng-container *ngFor="let match of entry.matches"
                                    [ngTemplateOutlet]="matchCard"
                                    [ngTemplateOutletContext]="{ $implicit: match }">
                                </ng-container>
                            </div>
                        </div>
                    </div>

                    <!-- The category has group matches, but the filters matched none. -->
                    <div class="col col-12 text-center" *ngIf="visibleGroups.length === 0 && hasCategoryMatches">
                        <p class="empty-filter-message">No hay partidos que coincidan con los filtros seleccionados.</p>
                    </div>

                    <div class="row foto-slider" *ngIf="selectedYear==='2023'" >
                        <div class="col col-12 col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <img *ngIf="selectedYear==='2023'" src="assets/grupos_aprendiz.jpeg" class="d-block w-100" alt="...">
                                </div>
                            </div>
                        </div>
                        <div class="col col-12 col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <img *ngIf="selectedYear==='2023'" src="assets/grupos_elite.jpeg" class="d-block w-100" alt="...">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>
</div>
