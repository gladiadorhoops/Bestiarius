<div class="row justify-content-md-center">
    <div class="accordion accordion-flush modern-accordion" id="accordionFlushExample">
        <div class="accordion-item">
            <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseStd" aria-expanded="false" aria-controls="flush-collapseOne">
                Standings
            </button>
            </h2>
            <div id="flush-collapseStd" class="accordion-collapse collapse show" >
            <div class="accordion-body">
                <div class="spinner-border text-light" role="status" *ngIf="loading">
                    <span class="sr-only">Loading...</span>
                </div>

                <!-- Reusable read-only match card, same format as the scouting page. -->
                <ng-template #matchCard let-match>
                    <div class="match-card match-card--readonly mb-3">
                        <!-- Category tag pinned top-left. -->
                        <span class="match-badge">{{match.category}}</span>

                        <div class="match-card__meta">
                            <!-- Primary line: which game + when. -->
                            <div class="match-card__title">
                                <span class="match-time"><i class="fas fa-clock"></i>&nbsp;{{match.time}}</span>
                            </div>
                            <!-- Secondary line: where (gym) — clickable. -->
                            <a class="match-location" target="_blank" rel="noopener"
                               href="https://www.google.com/maps/search/?api=1&query_place_id={{match.location.place_id}}&query={{match.location.address}}">
                                <i class="fas fa-location-dot"></i>&nbsp;{{match.location.name}}
                            </a>
                        </div>

                        <div class="match-card__scoreboard">
                            <div class="match-team">
                                <img class="tournament-match__logo" [src]="teamLogoUrl(match.homeTeam)" (error)="onLogoError($event)" alt="" />
                                <div class="match-team__name">{{match.homeTeam.name}}</div>
                                <div class="match-score match-score--static">{{match.homePoints}}</div>
                            </div>
                            <span class="match-vs">×</span>
                            <div class="match-team">
                                <img class="tournament-match__logo" [src]="teamLogoUrl(match.visitorTeam)" (error)="onLogoError($event)" alt="" />
                                <div class="match-team__name">{{match.visitorTeam.name}}</div>
                                <div class="match-score match-score--static">{{match.visitorPoints}}</div>
                            </div>
                        </div>
                    </div>
                </ng-template>

                <div class="row" *ngIf="!loading">
                    <div class="col col-12 padded-col" *ngIf="category === 'aprendiz' && standingMatches.length>0">
                        <ng-container *ngFor="let match of standingMatches"
                            [ngTemplateOutlet]="matchCard"
                            [ngTemplateOutletContext]="{ $implicit: match }">
                        </ng-container>
                    </div>
                    <div class="col col-12 padded-col" *ngIf="category === 'elite' && standingMatchesElite.length>0">
                        <ng-container *ngFor="let match of standingMatchesElite"
                            [ngTemplateOutlet]="matchCard"
                            [ngTemplateOutletContext]="{ $implicit: match }">
                        </ng-container>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>
</div>
