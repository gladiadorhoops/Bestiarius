<div class="row justify-content-md-center ">
    <div class="accordion accordion-flush modern-accordion" id="accordionFlushExample">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseBckt" aria-expanded="false" aria-controls="flush-collapseOne">
                Brackets
            </button>
          </h2>
          <div id="flush-collapseBckt" class="accordion-collapse collapse show" >
            <div class="accordion-body">
                <div class="spinner-border text-light" role="status" *ngIf="loading">
                    <span class="sr-only">Loading...</span>
                </div>
                <div class="row" *ngIf="!loading">

                    <!-- Reusable card: two rows (logo + abbreviation + score); click reveals gym/date/time. -->
                    <ng-template #matchCard let-match>
                        <div class="tournament-bracket__match"
                             [class.tournament-bracket__match--expanded]="isExpanded(match)"
                             tabindex="0"
                             (click)="toggleMatch(match)"
                             (keydown.enter)="toggleMatch(match)"
                             (keydown.space)="toggleMatch(match)">

                            <div class="tournament-bracket__team"
                                 [class.tournament-bracket__team--winner]="+match.homePoints > +match.visitorPoints">
                                <img class="tournament-bracket__logo" [src]="teamLogoUrl(match.homeTeam)" (error)="onLogoError($event)" alt="" />
                                <abbr class="tournament-bracket__code" [title]="match.homeTeam.name">{{ abbr(match.homeTeam.name) }}</abbr>
                                <span class="tournament-bracket__number">{{ match.homePoints }}</span>
                            </div>

                            <div class="tournament-bracket__team"
                                 [class.tournament-bracket__team--winner]="+match.visitorPoints > +match.homePoints">
                                <img class="tournament-bracket__logo" [src]="teamLogoUrl(match.visitorTeam)" (error)="onLogoError($event)" alt="" />
                                <abbr class="tournament-bracket__code" [title]="match.visitorTeam.name">{{ abbr(match.visitorTeam.name) }}</abbr>
                                <span class="tournament-bracket__number">{{ match.visitorPoints }}</span>
                            </div>

                            <div class="tournament-bracket__details" *ngIf="isExpanded(match)">
                                <span class="tournament-bracket__matchup">{{ match.homeTeam.name }} vs {{ match.visitorTeam.name }}</span>
                                <a [href]="mapsUrl(match.location)" target="_blank" rel="noopener" (click)="$event.stopPropagation()">
                                    {{ match.location.name }}
                                </a>
                                <span class="tournament-bracket__time">{{ match.time }}</span>
                                <!-- Gym's live transmission, only when one is registered. -->
                                <a class="tournament-bracket__feed" *ngIf="match.location.live_feed"
                                   [href]="match.location.live_feed" target="_blank" rel="noopener"
                                   (click)="$event.stopPropagation()"
                                   title="Transmisión en Vivo" aria-label="Transmisión en Vivo">
                                    <i class="fas fa-video"></i>
                                </a>
                            </div>
                        </div>
                    </ng-template>

                    <!-- One bracket per category, with explicit round sections and connector cues. -->
                    <ng-template #bracket let-matches>
                        <div class="container text-center">
                            <div class="tournament-bracket-scroll">
                                <div class="tournament-bracket" #bracketLayout>
                                    <div class="tournament-bracket__round" *ngIf="hasQuarterfinalMatches(matches)">
                                        <h3 class="tournament-bracket__round-title">Cuartos</h3>
                                        <div class="tournament-bracket__slot-list">
                                            <div class="tournament-bracket__slot tournament-bracket__slot--quarter" *ngFor="let match of getQuarterfinalMatches(matches)">
                                                <ng-container *ngIf="match; else emptySlot">
                                                    <ng-container [ngTemplateOutlet]="matchCard" [ngTemplateOutletContext]="{ $implicit: match }"></ng-container>
                                                </ng-container>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="tournament-bracket__round tournament-bracket__round--semifinals">
                                        <h3 class="tournament-bracket__round-title">Semifinales</h3>
                                        <div class="tournament-bracket__slot-list">
                                            <div class="tournament-bracket__slot tournament-bracket__slot--semifinal"
                                                 [class.tournament-bracket__slot--semifinal-first]="i === 0"
                                                 [class.tournament-bracket__slot--semifinal-second]="i === 1"
                                                 *ngFor="let match of getSemifinalMatches(matches); let i = index">
                                                <div class="tournament-bracket__connector tournament-bracket__connector--quarter"
                                                     [class.tournament-bracket__connector--first]="i === 0"
                                                     [class.tournament-bracket__connector--second]="i === 1"
                                                     *ngIf="hasQuarterfinalMatches(matches)"></div>
                                                <ng-container *ngIf="match; else emptySlot">
                                                    <ng-container [ngTemplateOutlet]="matchCard" [ngTemplateOutletContext]="{ $implicit: match }"></ng-container>
                                                </ng-container>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="tournament-bracket__round tournament-bracket__round--final">
                                        <h3 class="tournament-bracket__round-title">Final</h3>
                                        <div class="tournament-bracket__slot-list">
                                            <div class="tournament-bracket__slot tournament-bracket__slot--final">
                                                <div class="tournament-bracket__connector tournament-bracket__connector--final"></div>
                                                <ng-container *ngIf="getFinalMatch(matches); else emptySlot">
                                                    <ng-container [ngTemplateOutlet]="matchCard" [ngTemplateOutletContext]="{ $implicit: getFinalMatch(matches) }"></ng-container>
                                                </ng-container>
                                            </div>

                                            <div class="tournament-bracket__slot tournament-bracket__slot--third" *ngIf="getThirdPlaceMatch(matches)">
                                                <span class="tournament-bracket__third-label">Tercer lugar</span>
                                                <ng-container [ngTemplateOutlet]="matchCard" [ngTemplateOutletContext]="{ $implicit: getThirdPlaceMatch(matches) }"></ng-container>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </ng-template>

                    <ng-template #emptySlot>
                        <div class="tournament-bracket__placeholder">Por definir</div>
                    </ng-template>

                    <ng-container *ngIf="category === 'elite' && showElite"
                        [ngTemplateOutlet]="bracket"
                        [ngTemplateOutletContext]="{ $implicit: phaseMatchesElite }">
                    </ng-container>

                    <ng-container *ngIf="category === 'aprendiz' && showAprendiz"
                        [ngTemplateOutlet]="bracket"
                        [ngTemplateOutletContext]="{ $implicit: phaseMatches }">
                    </ng-container>

                </div>
            </div>
          </div>
        </div>
    </div>
</div>
