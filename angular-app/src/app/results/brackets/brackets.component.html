<div class="row justify-content-md-center ">
    <div class="accordion accordion-flush modern-accordion" id="accordionFlushExample">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseBckt" aria-expanded="false" aria-controls="flush-collapseOne">
                Brackets
            </button>
          </h2>
          <div id="flush-collapseBckt" class="accordion-collapse collapse show" >
            <div class="accordion-body">
                <div class="spinner-border text-light" role="status" *ngIf="loading">
                    <span class="sr-only">Loading...</span>
                </div>
                <div class="row" *ngIf="!loading">

                    <!-- Reusable card: two rows (logo + abbreviation + score); click reveals gym/date/time. -->
                    <ng-template #matchCard let-match>
                        <div class="tournament-bracket__match"
                             [class.tournament-bracket__match--expanded]="isExpanded(match)"
                             tabindex="0"
                             (click)="toggleMatch(match)"
                             (keydown.enter)="toggleMatch(match)"
                             (keydown.space)="toggleMatch(match)">

                            <div class="tournament-bracket__team"
                                 [class.tournament-bracket__team--winner]="+match.homePoints > +match.visitorPoints">
                                <img class="tournament-bracket__logo" [src]="teamLogoUrl(match.homeTeam)" (error)="onLogoError($event)" alt="" />
                                <abbr class="tournament-bracket__code" [title]="match.homeTeam.name">{{ abbr(match.homeTeam.name) }}</abbr>
                                <span class="tournament-bracket__number">{{ match.homePoints }}</span>
                            </div>

                            <div class="tournament-bracket__team"
                                 [class.tournament-bracket__team--winner]="+match.visitorPoints > +match.homePoints">
                                <img class="tournament-bracket__logo" [src]="teamLogoUrl(match.visitorTeam)" (error)="onLogoError($event)" alt="" />
                                <abbr class="tournament-bracket__code" [title]="match.visitorTeam.name">{{ abbr(match.visitorTeam.name) }}</abbr>
                                <span class="tournament-bracket__number">{{ match.visitorPoints }}</span>
                            </div>

                            <div class="tournament-bracket__details" *ngIf="isExpanded(match)">
                                <span class="tournament-bracket__matchup">{{ match.homeTeam.name }} vs {{ match.visitorTeam.name }}</span>
                                <a [href]="mapsUrl(match.location)" target="_blank" rel="noopener" (click)="$event.stopPropagation()">
                                    {{ match.location.name }}
                                </a>
                                <span class="tournament-bracket__time">{{ match.time }}</span>
                            </div>
                        </div>
                    </ng-template>

                    <!-- One bracket per category, both driven by the same rounds config. -->
                    <ng-template #bracket let-matches>
                        <div class="container text-center">
                            <div class="tournament-bracket tournament-bracket--rounded">
                                <div class="tournament-bracket__round tournament-bracket__round--{{ round.cssClass }}"
                                     *ngFor="let round of rounds">
                                    <h3 class="tournament-bracket__round-title">{{ round.title }}</h3>
                                    <ul class="tournament-bracket__list">
                                        <li class="tournament-bracket__item" *ngFor="let place of round.places">
                                            <ng-container *ngIf="matches[place]"
                                                [ngTemplateOutlet]="matchCard"
                                                [ngTemplateOutletContext]="{ $implicit: matches[place] }">
                                            </ng-container>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </ng-template>

                    <ng-container *ngIf="category === 'elite' && showElite"
                        [ngTemplateOutlet]="bracket"
                        [ngTemplateOutletContext]="{ $implicit: phaseMatchesElite }">
                    </ng-container>

                    <ng-container *ngIf="category === 'aprendiz' && showAprendiz"
                        [ngTemplateOutlet]="bracket"
                        [ngTemplateOutletContext]="{ $implicit: phaseMatches }">
                    </ng-container>

                </div>
            </div>
          </div>
        </div>
    </div>
</div>
